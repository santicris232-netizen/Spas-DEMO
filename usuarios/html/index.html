<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#071a1a">
  <title>Maison Lash - Usuario</title>
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>
  <main class="mobile-shell">
    <header class="app-header">
      <div class="brand-block">
        <p class="brand-kicker">Cliente</p>
        <h1 class="brand-name">MAISON LASH</h1>
      </div>
      <div class="header-actions">
        <span class="role-pill" id="client-name-pill">Usuario</span>
        <button class="icon-button" id="logout-button" type="button" aria-label="Cerrar sesion">Salir</button>
      </div>
    </header>

    <nav class="segment-scroll" aria-label="Menu de usuario">
      <button class="segment-button active" type="button" data-view="appointments-view">Mis citas</button>
      <button class="segment-button" type="button" data-view="products-view">Productos</button>
      <button class="segment-button" type="button" data-view="services-view">Servicios</button>
      <button class="segment-button" type="button" data-view="brows-view">Cejas</button>
      <button class="segment-button" type="button" data-view="lips-view">Labios</button>
      <button class="segment-button" type="button" data-view="lashes-view">Pestanas</button>
    </nav>

    <section class="mobile-content">
      <div id="appointments-view" class="view active">
        <p class="section-kicker">Agenda</p>
        <h2 class="section-title" id="welcome-title">Mis citas</h2>
        <div class="stack-list" id="appointments-list"></div>
      </div>

      <div id="products-view" class="view">
        <p class="section-kicker">Catalogo</p>
        <h2 class="section-title">Productos</h2>
        <div class="card-grid" id="products-list"></div>
      </div>

      <div id="services-view" class="view">
        <p class="section-kicker">Agenda</p>
        <h2 class="section-title">Servicios</h2>
        <div class="card-grid" id="services-list"></div>
      </div>

      <div id="brows-view" class="view">
        <p class="section-kicker">Servicios</p>
        <h2 class="section-title">Cejas</h2>
        <div class="card-grid" id="brows-list"></div>
      </div>

      <div id="lips-view" class="view">
        <p class="section-kicker">Servicios</p>
        <h2 class="section-title">Labios</h2>
        <div class="card-grid" id="lips-list"></div>
      </div>

      <div id="lashes-view" class="view">
        <p class="section-kicker">Servicios</p>
        <h2 class="section-title">Pestanas</h2>
        <div class="card-grid" id="lashes-list"></div>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="booking-sheet" aria-hidden="true">
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="booking-title">
      <div class="sheet-header">
        <div>
          <p class="section-kicker">Asignacion</p>
          <h2 class="sheet-title" id="booking-title">Nueva cita</h2>
        </div>
        <button class="icon-button" id="close-booking" type="button" aria-label="Cerrar">X</button>
      </div>
      <form class="sheet-body" id="booking-form" autocomplete="off">
        <input type="hidden" id="booking-service-id">
        <div class="booking-service-summary" id="booking-service-summary"></div>
        <div class="field-group">
          <label for="booking-employee">Especialista</label>
          <select id="booking-employee" required></select>
        </div>
        <div class="field-group">
          <label>Fecha y hora disponibles</label>
          <div class="availability-wrapper" id="booking-availability"></div>
        </div>
        <input type="hidden" id="booking-date" required>
        <input type="hidden" id="booking-time" required>
        <button class="primary-button" type="submit">Confirmar por WhatsApp</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../compartido/js/data-store.js"></script>
  <script src="../../compartido/js/auth.js"></script>
  <script src="../../compartido/js/ui.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
