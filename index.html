<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a1a">
  <title>Maison Lash - Acceso</title>
  <link rel="stylesheet" href="compartido/css/base.css">
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-brand">
        <p class="brand-kicker">By Cami Portela</p>
        <h1 class="brand-name" id="auth-title">MAISON LASH</h1>
      </div>

      <form id="login-form" class="auth-form" autocomplete="off">
        <div class="field-group">
          <label for="login-username">Usuario o correo</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label for="login-password">Contrasena</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button class="primary-button" type="submit">Ingresar</button>
        <button class="secondary-button" type="button" id="show-register-button">Crear cuenta</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden" autocomplete="off">
        <div class="field-row">
          <div class="field-group"><label for="register-name">Nombre</label><input type="text" id="register-name" required></div>
          <div class="field-group"><label for="register-lastname">Apellido</label><input type="text" id="register-lastname" required></div>
        </div>
        <div class="field-group"><label for="register-phone">Numero celular</label><input type="tel" id="register-phone" required></div>
        <div class="field-group"><label for="register-email">Correo</label><input type="email" id="register-email" required></div>
        <div class="field-group"><label for="register-password">Contrasena</label><input type="password" id="register-password" minlength="8" required></div>
        <div class="field-group"><label for="register-birthday">Fecha cumpleanos</label><input type="date" id="register-birthday" required></div>
        <button class="primary-button" type="submit">Registrarme</button>
        <button class="secondary-button" type="button" id="cancel-register-button">Volver</button>
        <p class="form-error" id="register-error"></p>
      </form>

      <div class="demo-access">
        <p><strong>usuario</strong> / user123</p>
        <p><strong>jefe</strong> / jefe123</p>
        <p><strong>empleado</strong> / empleado123</p>
        <p><strong>admin</strong> / admin123</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="compartido/js/data-store.js"></script>
  <script src="compartido/js/auth.js"></script>
  <script src="compartido/js/ui.js"></script>
  <script src="JavaScript/app.js"></script>
</body>
</html>
