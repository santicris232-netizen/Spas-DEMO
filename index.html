<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Lash | Book de Servicios</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:wght@700&family=Cinzel&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <h1 class="brand-name">MAISON LASH</h1>
        <span class="brand-sub">BY CAMI PORTELA</span>
    </header>

    <div class="book-wrapper">
        <div id="book" class="book">
            <div class="page" id="p1">
                <div class="front">
                    <div class="content">
                        <h2>Pestañas</h2>
                        <div class="service-img" style="background-image: url('img/pestanas.jpg');"></div>
                        <p>Realza tu mirada con nuestras técnicas de extensión y lifting.</p>
                        <div class="price">$150.000</div>
                        <button class="btn-agendar" onclick="abrirModal('Pestañas')">Reservar Cupo</button>
                    </div>
                </div>
                <div class="back"></div>
            </div>

            <div class="page" id="p2">
                <div class="front">
                    <div class="content">
                        <h2>Cejas</h2>
                        <div class="service-img" style="background-image: url('img/cejas.jpg');"></div>
                        <p>Diseño, depilación y laminado para un marco perfecto.</p>
                        <div class="price">$80.000</div>
                        <button class="btn-agendar" onclick="abrirModal('Cejas')">Reservar Cupo</button>
                    </div>
                </div>
                <div class="back"></div>
            </div>

            <div class="page" id="p3">
                <div class="front">
                    <div class="content">
                        <h2>Labios</h2>
                        <div class="service-img" style="background-image: url('img/labios.jpg');"></div>
                        <p>Micropigmentación y humectación profunda para labios radiantes.</p>
                        <div class="price">$200.000</div>
                        <button class="btn-agendar" onclick="abrirModal('Labios')">Reservar Cupo</button>
                    </div>
                </div>
                <div class="back"></div>
            </div>
        </div>
    </div>

    <a href="https://wa.me/tunumero" class="whatsapp-float" target="_blank">
        <img src="img/ws-icon.png" alt="WhatsApp Help">
    </a>

    <script src="js/main.js"></script>
</body>
</html>
