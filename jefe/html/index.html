<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#175050">
  <title>CristaSpa</title>
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="../css/jefe.css">
  <script type="module" src="../js/jefe.js"></script>
</head>
<body>
  <main class="mobile-shell">
    <header class="app-header">
      <div class="brand-row">
        <div data-marca-logo></div>
        <div class="brand-block">
          <p class="brand-kicker" id="rol-kicker">Jefe</p>
          <h1 class="brand-name" data-marca-nombre>CristaSpa</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="cerrar-sesion" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">⎋</button>
      </div>
    </header>

    <nav class="segment-scroll" aria-label="Menú del negocio" id="navegacion">
      <button class="segment-button active" type="button" data-view="vista-agenda">Agenda</button>
      <button class="segment-button" type="button" data-view="vista-clientes">Clientes</button>
      <button class="segment-button solo-jefe" type="button" data-view="vista-catalogo">Catálogo</button>
      <button class="segment-button solo-jefe" type="button" data-view="vista-equipo">Equipo</button>
      <button class="segment-button solo-jefe" type="button" data-view="vista-empresa">Mi empresa</button>
      <button class="segment-button solo-jefe" type="button" data-view="vista-reportes">Reportes</button>
    </nav>

    <section class="mobile-content boss-content">
      <!-- Agenda -->
      <div id="vista-agenda" class="view active">
        <div id="checklist" class="solo-jefe"></div>
        <div class="agenda-controles">
          <button class="icon-button oscuro" type="button" id="agenda-anterior" aria-label="Anterior">‹</button>
          <button class="fecha-actual" type="button" id="agenda-hoy" title="Ir a hoy"><span id="agenda-titulo"></span></button>
          <button class="icon-button oscuro" type="button" id="agenda-siguiente" aria-label="Siguiente">›</button>
        </div>
        <div class="chip-list agenda-filtros">
          <button class="chip-option active" type="button" data-rango="dia">Día</button>
          <button class="chip-option" type="button" data-rango="semana">Semana</button>
          <select id="agenda-especialista" aria-label="Filtrar por especialista"></select>
          <select id="agenda-estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendientes</option>
            <option value="confirmada">Confirmadas</option>
            <option value="completada">Realizadas</option>
            <option value="no_asistio">No asistió</option>
            <option value="cancelada">Canceladas</option>
          </select>
        </div>
        <input type="search" id="agenda-busqueda" class="busqueda" placeholder="Buscar cliente en esta vista…" aria-label="Buscar cliente">
        <button class="primary-button" type="button" id="nueva-cita" data-escritura>+ Nueva cita</button>
        <div class="stack-list boss-list" id="agenda-lista"></div>
      </div>

      <!-- Clientes -->
      <div id="vista-clientes" class="view">
        <p class="section-kicker">Personas</p>
        <h2 class="section-title">Clientes</h2>
        <input type="search" id="clientes-busqueda" class="busqueda" placeholder="Buscar por nombre, correo o celular…" aria-label="Buscar clientes">
        <div class="acciones-fila">
          <button class="primary-button" type="button" id="nuevo-cliente" data-escritura>+ Nuevo cliente</button>
          <button class="secondary-button solo-jefe" type="button" id="exportar-clientes">Exportar CSV</button>
        </div>
        <div class="stack-list boss-list" id="clientes-lista"></div>
      </div>

      <!-- Catálogo -->
      <div id="vista-catalogo" class="view">
        <p class="section-kicker">Oferta</p>
        <h2 class="section-title">Catálogo</h2>
        <div class="chip-list" id="catalogo-pestanas">
          <button class="chip-option active" type="button" data-sub="servicios">Servicios</button>
          <button class="chip-option" type="button" data-sub="productos">Productos</button>
          <button class="chip-option" type="button" data-sub="categorias">Categorías</button>
        </div>
        <button class="primary-button" type="button" id="catalogo-nuevo" data-escritura>+ Nuevo servicio</button>
        <div class="stack-list boss-list" id="catalogo-lista"></div>
      </div>

      <!-- Equipo -->
      <div id="vista-equipo" class="view">
        <p class="section-kicker">Personas</p>
        <h2 class="section-title">Equipo</h2>
        <div class="chip-list" id="equipo-pestanas">
          <button class="chip-option active" type="button" data-sub="especialistas">Especialistas</button>
          <button class="chip-option" type="button" data-sub="miembros">Jefes y recepción</button>
          <button class="chip-option" type="button" data-sub="cierres">Cierres y ausencias</button>
        </div>
        <button class="primary-button" type="button" id="equipo-nuevo" data-escritura>+ Nuevo especialista</button>
        <div class="stack-list boss-list" id="equipo-lista"></div>
      </div>

      <!-- Mi empresa -->
      <div id="vista-empresa" class="view">
        <p class="section-kicker">Configuración</p>
        <h2 class="section-title">Mi empresa</h2>
        <div id="empresa-secciones" class="stack-list"></div>
      </div>

      <!-- Reportes -->
      <div id="vista-reportes" class="view">
        <p class="section-kicker">Resultados</p>
        <h2 class="section-title">Reportes</h2>
        <div class="field-group"><label for="reportes-mes">Mes</label><input type="month" id="reportes-mes"></div>
        <div id="reportes-contenido" class="stack-list"></div>
      </div>
    </section>
  </main>

  <!-- Hoja genérica: cada sección dibuja aquí su formulario -->
  <div class="sheet-backdrop" id="hoja" aria-hidden="true">
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
      <div class="sheet-header">
        <div>
          <p class="section-kicker" id="hoja-kicker"></p>
          <h2 class="sheet-title" id="hoja-titulo"></h2>
        </div>
        <button class="icon-button" type="button" data-cerrar-hoja aria-label="Cerrar">✕</button>
      </div>
      <div id="hoja-contenido"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
